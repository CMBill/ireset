[project]
name = "ireset"
version = "0.1.0"
description = "Interaction-preserving motion retargeting for Unitree G1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.13.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "scipy>=1.18.1",
    "torch>=2.14.0",
    "trimesh>=5.1.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[tool.uv]
package = false
